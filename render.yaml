databases:
  - name: neurax-db
    databaseName: neurax_db
    user: neurax
    plan: free

services:
  - type: web
    name: neurax
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@neurax.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: MAIL_EMAIL
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Automatically connected Render PostgreSQL Database
      - key: DATABASE_URL
        fromDatabase:
          name: neurax-db
          property: connectionString
